# Untested blueprint. Verify field names against Render's current docs.
databases:
  - name: campaory-db
    plan: free
    databaseName: campaory
    user: campaory

services:
  - type: web
    name: campaory
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: gemma
      - key: LLM_FALLBACK_TO_MOCK
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: campaory-db
          property: connectionString
      - key: BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMMA_MODEL
        sync: false
      - key: EURI_API_KEY
        sync: false
      - key: EURI_MODEL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
