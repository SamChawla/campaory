# Paid plans so the service never sleeps and the database does not expire (Render credits).
databases:
  - name: campaory-db
    plan: basic-256mb
    databaseName: campaory
    user: campaory

services:
  - type: web
    name: campaory
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: euri
      - key: LLM_FALLBACK_TO_MOCK
        value: "true"
      - key: LLM_TIMEOUT_SECONDS
        value: "25"
      - key: DATABASE_URL
        fromDatabase:
          name: campaory-db
          property: connectionString
      - key: BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: EURI_API_KEY
        sync: false
      - key: EURI_MODEL
        value: google/gemma-4-26B-A4B-it
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
