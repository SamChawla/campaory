repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend lint
        entry: bash -c "cd frontend && npm run lint"
        language: system
        files: ^frontend/src/
        pass_filenames: false
